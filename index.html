<!-- SCRIPT OFICIAL DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://lmhaokkhlqyxzcfkzvq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f4G88bTlqJ5eh1Ojtkd4fw_kGkoLcSJ';
        
        let db = null;
        try {
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Error al inicializar Supabase:', e);
        }

        const PLANS = {
            base: [
                { id: 'shein', name: 'Plan Shein (Entrada)', price: 3000, return: 4000, days: 2, unique: true, img: 'shein.png' },
                { id: 'zara', name: 'Plan Zara', price: 5000, return: 6600, days: 4, unique: false, img: 'zara.png' },
                { id: 'hm', name: 'Plan H&M', price: 10000, return: 15000, days: 8, unique: false, img: 'hm.png' },
                { id: 'adidas', name: 'Plan Adidas', price: 20000, return: 30000, days: 15, unique: false, img: 'adidas.png' },
                { id: 'nike', name: 'Plan Nike', price: 40000, return: 60000, days: 25, unique: false, img: 'nike.png' }
            ],
            exclusive: [
                { id: 'armani', name: 'Plan Armani', price: 75000, return: 112500, days: 30, unique: true, img: 'armani.png' },
                { id: 'gucci', name: 'Plan Gucci', price: 150000, return: 225000, days: 30, unique: true, img: 'gucci.png' },
                { id: 'prada', name: 'Plan Prada', price: 300000, return: 450000, days: 30, unique: true, img: 'prada.png' },
                { id: 'lv', name: 'Plan Louis Vuitton', price: 600000, return: 900000, days: 30, unique: true, img: 'lv.png' },
                { id: 'rolex', name: 'Plan Rolex', price: 1000000, return: 1500500, days: 30, unique: true, img: 'rolex.png' }
            ]
        };

        let currentUser = { username: '', balance: 0, accumulated: 0, investments: [], last_bonus: '' };
        let currentPlanCategory = 'base';

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('aura_logged_user');
            if (savedUser && db) {
                let { data } = await db.from('users').select('*').eq('username', savedUser).maybeSingle();
                if (data) {
                    currentUser = data;
                    iniciarApp(currentUser.username);
                    return;
                }
            }
            document.getElementById('auth-container').classList.remove('hidden');
        });

        function switchAuthTab(tab) {
            document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
            document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
            document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
            document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const pin = document.getElementById('reg-pin').value;

            if (pin.length < 6 || pin.length > 8) {
                alert('El PIN de seguridad debe tener entre 6 y 8 caracteres.');
                return;
            }

            currentUser = {
                username: username,
                balance: 0,
                accumulated: 0,
                investments: [],
                last_bonus: ''
            };

            if (db) {
                // Inserción estricta obligatoria en Supabase
                const { error } = await db.from('users').insert([currentUser]);
                if (error) {
                    alert('Error estricto de Supabase: ' + error.message);
                    return;
                }
            } else {
                alert('No se pudo conectar con Supabase.');
                return;
            }

            localStorage.setItem('aura_logged_user', username);
            iniciarApp(username);
            document.getElementById('launch-popup').classList.remove('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            
            let foundData = null;
            if (db) {
                let { data } = await db.from('users').select('*').eq('username', username).maybeSingle();
                if (data) foundData = data;
            }

            if (!foundData) {
                alert('Usuario no encontrado en la base de datos de Supabase.');
                return;
            }

            currentUser = foundData;
            localStorage.setItem('aura_logged_user', currentUser.username);
            iniciarApp(currentUser.username);
        }

        function iniciarApp(username) {
            document.getElementById('header-username').innerText = username;
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            renderPlans();
            renderMyInvestments();
            initReferralLink(username);
            updateUI();
        }

        function closeLaunchPopup() {
            document.getElementById('launch-popup').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
        }

        function switchSection(sectionNumber) {
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(`section-${sectionNumber}`).classList.add('active');
            document.querySelectorAll('.nav-btn')[sectionNumber - 1].classList.add('active');
        }

        function switchPlanCategory(category) {
            currentPlanCategory = category;
            document.getElementById('tab-base').classList.toggle('active', category === 'base');
            document.getElementById('tab-exclusive').classList.toggle('active', category === 'exclusive');
            renderPlans();
        }

        function renderPlans() {
            const plans = PLANS[currentPlanCategory];
            document.getElementById('plans-grid').innerHTML = plans.map(p => `
                <div class="plan-card">
                    <img src="${p.img}" alt="${p.name}" class="plan-logo" onerror="this.src='https://via.placeholder.com/50?text=Aura'">
                    <div class="plan-info">
                        <h4>${p.name}</h4>
                        <p>Inv: $${p.price.toLocaleString()} | Ret: $${p.return.toLocaleString()}</p>
                        <p>Duración: ${p.days} días ${p.unique ? '(Única)' : ''}</p>
                    </div>
                    <button class="btn-invest" onclick="buyPlan('${p.id}', '${p.name}', ${p.price}, ${p.return}, ${p.days})">Invertir</button>
                </div>
            `).join('');
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = `$${(currentUser.balance || 0).toLocaleString()} ARS`;
            document.getElementById('accumulated-balance').innerText = `$${(currentUser.accumulated || 0).toLocaleString()} ARS`;
        }

        async function syncToSupabase() {
            if (db && currentUser.username) {
                await db.from('users').update({
                    balance: currentUser.balance,
                    accumulated: currentUser.accumulated,
                    investments: currentUser.investments,
                    last_bonus: currentUser.last_bonus
                }).eq('username', currentUser.username);
            }
        }

        async function buyPlan(planId, planName, price, planReturn, days) {
            if (currentUser.balance < price) {
                alert('Saldo insuficiente para adquirir este plan.');
                return;
            }
            currentUser.balance -= price;
            currentUser.investments.push({
                id: planId, name: planName, price: price, return: planReturn, days: days, date: new Date().toLocaleDateString()
            });
            updateUI();
            renderMyInvestments();
            await syncToSupabase();
            alert(`¡Has invertido con éxito en el ${planName}!`);
        }

        function renderMyInvestments() {
            const container = document.getElementById('my-investments-list');
            if (!currentUser.investments || currentUser.investments.length === 0) {
                container.innerHTML = `<p class="info-small" style="text-align:center; margin-top:20px;">Aún no tienes inversiones activas.</p>`;
                return;
            }
            container.innerHTML = currentUser.investments.map(inv => `
                <div class="plan-card" style="margin-bottom: 10px;">
                    <div class="plan-info">
                        <h4 style="color: var(--success);">${inv.name}</h4>
                        <p>Invertido: $${inv.price.toLocaleString()} | Retorno: $${inv.return.toLocaleString()}</p>
                        <p>Fecha: ${inv.date} (${inv.days} días)</p>
                    </div>
                </div>
            `).join('');
        }

        async function claimDailyBonus() {
            const today = new Date().toISOString().slice(0, 10);
            if (currentUser.last_bonus === today) {
                alert('⏳ Ya has reclamado tu bono diario hoy. ¡Vuelve mañana!');
                return;
            }
            currentUser.balance += 250;
            currentUser.last_bonus = today;
            updateUI();
            await syncToSupabase();
            alert('¡Bono diario de $250 reclamado con éxito!');
        }

        function copyCVU() {
            const cvuInput = document.getElementById('cvu-text');
            cvuInput.select();
            navigator.clipboard.writeText(cvuInput.value);
            alert('¡CVU copiado al portapapeles!');
        }

        function requestWithdrawal() {
            const amount = document.getElementById('withdraw-amount').value;
            if (!amount || amount <= 0) {
                alert('Ingresa un monto válido para retirar.');
                return;
            }
            alert(`Solicitud de retiro por $${amount} enviada. Sujeta a horario hábil (9 a 21 hs).`);
        }

        function initReferralLink(username) {
            document.getElementById('referral-link').value = `https://aura.io/ref/${username}`;
        }

        function copyReferralLink() {
            const linkInput = document.getElementById('referral-link');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value);
            alert('¡Enlace copiado al portapapeles!');
        }

        async function saveProfileAndClaimBonus(event) {
            event.preventDefault();
            const fullname = document.getElementById('profile-fullname').value;
            const cbu = document.getElementById('profile-cbu').value;
            const alias = document.getElementById('profile-alias').value;

            if (!fullname || !cbu || !alias) {
                alert('Todos los campos bancarios son obligatorios.');
                return;
            }

            currentUser.balance += 500;
            updateUI();
            await syncToSupabase();
            alert('¡Datos guardados con éxito! Se acreditó tu bono de bienvenida de $500 ARS y tus retiros están habilitados.');
        }

        function logout() {
            localStorage.removeItem('aura_logged_user');
            currentUser = { username: '', balance: 0, accumulated: 0, investments: [], last_bonus: '' };
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('register-form').reset();
            document.getElementById('login-form').reset();
        }
    </script>
